<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brief History | Materials Markets Intelligence</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-card: #21262d;
            --text-primary: #e6edf3;
            --text-secondary: #8b949e;
            --accent-blue: #58a6ff;
            --border-color: #30363d;
        }
        
        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        .navbar {
            background: var(--bg-secondary) !important;
            border-bottom: 1px solid var(--border-color);
        }
        
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            margin-bottom: 1.5rem;
        }
        
        .card-header {
            background: transparent;
            border-bottom: 1px solid var(--border-color);
        }
        
        .brief-content {
            background: var(--bg-secondary);
            border-radius: 8px;
            padding: 1.5rem;
            font-size: 0.9rem;
            line-height: 1.6;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .timestamp {
            color: var(--text-secondary);
            font-size: 0.85rem;
        }
        
        a { color: var(--accent-blue); }
        a:hover { color: #79b8ff; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark mb-4">
        <div class="container-fluid">
            <a href="/" class="navbar-brand mb-0 h1">
                <i class="fas fa-arrow-left me-2"></i>
                Back to Dashboard
            </a>
        </div>
    </nav>

    <div class="container">
        <h2 class="mb-4">
            <i class="fas fa-history me-2"></i>
            Brief History
        </h2>

        {% if briefs %}
            {% for brief in briefs %}
            <div class="card">
                <div class="card-header">
                    <i class="fas fa-calendar me-2"></i>
                    {{ brief.run_at }}
                </div>
                <div class="card-body">
                    <div class="brief-content" id="brief-{{ loop.index }}">
                        {{ brief.content }}
                    </div>
                </div>
            </div>
            {% endfor %}
        {% else %}
            <div class="text-center py-5">
                <i class="fas fa-inbox fa-3x mb-3 text-secondary"></i>
                <p class="text-secondary">No historical briefs available.</p>
            </div>
        {% endif %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('[id^="brief-"]').forEach(el => {
                if (typeof marked !== 'undefined') {
                    el.innerHTML = marked.parse(el.textContent);
                }
            });
        });
    </script>
</body>
</html>
