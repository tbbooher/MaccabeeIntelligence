name: daily-brief
description: "Synthesizes all agent outputs into actionable daily intelligence report"
version: "1.0.0"

model:
  provider: "anthropic"
  model: "claude-3-5-sonnet-20241022"
  temperature: 0.2
  max_tokens: 8000

dependencies:
  - "global-events-monitor"
  - "supply-chain-intel"
  - "demand-signals"
  - "price-patterns"
  - "risk-manager"

tools:
  - name: agent_query
    description: "Query other agents for latest data"
  - name: data_fetch
    description: "Fetch stored analysis data"
  - name: report_generator
    description: "Generate formatted reports"
  - name: email_sender
    description: "Send reports via email"

schedule:
  cron: "0 8 * * *"  # 8:00 AM CT daily
  timezone: "America/Chicago"

output:
  format: "markdown"
  destinations:
    - "file://reports/daily-brief-{date}.md"
    - "email://tim@maccabeeintelligence.com"
    - "dashboard://latest-brief"

template: |
  # Materials Markets Intelligence Brief
  **{date} | Generated at {timestamp}**
  
  ## Executive Summary
  {executive_summary}
  
  ## Market Movers (24h)
  {market_movers}
  
  ## Global Events Impact
  {global_events}
  
  ## Supply Chain Status
  {supply_chain_status}
  
  ## Demand Signals
  {demand_signals}
  
  ## Technical Outlook
  {technical_analysis}
  
  ## Risk Alerts
  {risk_alerts}
  
  ## Strategy Recommendations
  {strategy_recommendations}
  
  ## Data Sources
  {data_sources}
  
  ---
  *This report is generated by Maccabee Intelligence automated analysis system.*

memory:
  type: "persistent"
  retention_days: 90
